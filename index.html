<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirect Button</title>
  <style>
    body {
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      margin:0;
      font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(180deg,#0f1724,#071029);
      color:#fff;
    }
    .card {
      text-align:center;
      padding:28px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    }
    h1 { margin:0 0 16px 0; font-size:18px; }
    button {
      background:#ef4444;
      color:#fff;
      border:none;
      padding:14px 20px;
      font-weight:700;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
    }
    button:hover { transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirect Example</h1>
    <button id="goBtn">CLICK PAULLY MOLLY</button>
  </div>

  <script>
    const url = "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
    document.getElementById('goBtn').addEventListener('click', () => {
      // open in new tab/window safely
      window.open(url, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
