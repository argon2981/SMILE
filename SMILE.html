<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Capture Example</title>
  <style>
    body { text-align: center; font-family: Arial, sans-serif; background: #111; color: white; padding: 40px; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1e40af; }
    video, canvas { margin-top: 20px; border-radius: 10px; }
  </style>
</head>
<body>

  <h2>Click to Open Camera & Capture Photo</h2>
  <button id="openCamera">CLICK PAULLY</button><br>
  <video id="video" width="320" height="240" autoplay style="display:none;"></video>
  <canvas id="canvas" width="320" height="240" style="display:none;"></canvas><br>
  <a id="emailLink" style="display:none; color:#38bdf8; font-weight:bold;" href="#">📧 Send via Email</a>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const emailLink = document.getElementById('emailLink');

    document.getElementById('openCamera').addEventListener('click', async () => {
      try {
        // Request camera access
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = 'block';

        // After 3 seconds, capture image
        setTimeout(() => {
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          video.style.display = 'none';
          canvas.style.display = 'block';

          // Stop the camera stream
          stream.getTracks().forEach(track => track.stop());

          // Convert to data URL and let user send via email
          const imageData = canvas.toDataURL('image/png');
          const mailBody = encodeURIComponent('Photo captured:\n\n' + imageData);
          emailLink.href = `mailto:mjcybercorner@gmail.com?subject=Camera Capture&body=${mailBody}`;
          emailLink.style.display = 'inline-block';
          emailLink.textContent = '📧 Send Photo via Email';
        }, 3000);
      } catch (err) {
        alert('Camera access was denied or not available.');
      }
    });
  </script>

</body>
</html>
